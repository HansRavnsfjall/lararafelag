# Keeps the Simply.com app pool awake during the day.
#
# Simply stops the pool after 20 minutes without traffic and starts it again on the
# next request. Two things follow from that, and this workflow addresses both:
#
#   1. Every cold start rebuilds NuCache and reopens both Lucene indexes. That is the
#      moment the 32-bit worker process sits closest to its ~1.4 GB address-space
#      ceiling, so each idle stop buys another memory spike.
#   2. The daily health report runs inside the app. While the pool is stopped it cannot
#      run at all, so "07:00" actually meant "first visit after 07:00".
#
# It deliberately does NOT run overnight. The nightly idle stop is a free process
# restart, which on a 32-bit process is worth keeping: it hands back whatever the day
# has leaked. Daytime warm, nightly reset.
#
# /healthz/build is used as the target because it returns a short string and touches
# neither the database nor the content cache, while still being enough to start the pool.

name: keepalive

on:
  schedule:
    # Every 10 minutes, 05:00-21:59 UTC. Faroe time is UTC+0 in winter and UTC+1 in
    # summer, so that is roughly 05:00-23:00 local year round, which covers the 06:00
    # daily report with room to spare. GitHub evaluates cron in UTC.
    - cron: '*/10 5-21 * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping sites
        run: |
          # -L follows redirects: the apex lararafelag.fo 301s to www, and a bare 3xx
          # in the log reads like a failure even though it does wake the pool.
          # No 'set -e'. A failed ping must not turn into a red run and an email every
          # ten minutes; the daily health report is what reports on the site's state.
          for url in \
            "https://www.skulabladid.fo/healthz/build" \
            "https://www.lararafelag.fo/healthz/build"
          do
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
                     -L --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors \
                     -A 'lararafelag-keepalive (github actions)' \
                     "$url" || echo "000")
            echo "$url -> HTTP $code  $(head -c 120 /tmp/body.txt)"
          done
